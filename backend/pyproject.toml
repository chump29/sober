[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13,<0.14"]

[project]
authors = [{ name = "Chris Post", email = "admin@postfmly.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment :: Mozilla",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.16.0",
    "cachetools>=8.0.3",
    "fastapi-guard>=8.1.2",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.165.0",
    "loadfig>=0.1.1",
    "nh3>=0.3.8",
    "peewee>=4.5.3",
    "pluralizer>=2.0.0",
    "pydantic>=2.14.4",
    "pyjwt>=2.15.1",
    "python-box>=8.0.1",
    "rich>=15.0.0",
    "secure>=2.0.2",
    "semver>=3.2.0",
    "uvicorn>=0.54.0",
    "venvalid>=0.3.0",
    "whenever>=0.11.0",
    "xxhash>=4.1.0",
]
description = "Sobriety tracker (Backend)"
keywords = ["sober", "sobriety", "tracker"]
license = "GPL-3.0-only"
name = "sober-backend"
requires-python = ">=3.15"
version = "2.0.0"

[project.urls]
GitHub = "https://github.com/chump29/sober"

[project.optional-dependencies]
dev = [
    "behave>=1.3.3",
    "coverage>=7.17.5",
    "mimesis>=22.2.0",
    "pre-commit>=4.7.0",
    "ty>=0.0.112",
    "typer>=0.29.3",
    "types-behave>=1.3.0.20261111",
    "types-peewee>=4.5.3.20261126",
]

[tool.bandit]
exclude_dirs = [".venv", "environment.py", "api.test.py"]
skips = ["B104"]

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.coverage.report]
exclude_also = [
    "except",
    "if DEBUG",
    "if __name__",
    "invalid_port",
    "verify_jwt",
]
precision = 2
show_missing = true

[tool.coverage.run]
data_file = "coverage/.coverage"
omit = ["features/**/*.py"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.pylint.design]
min-public-methods = 0

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'features')"
extension-pkg-allow-list = ["nh3"]

[tool.ruff.lint]
ignore = ["D203", "D212", "D400", "D415", "S101"]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FAST",
    "FIX",
    "FLY",
    "FURB",
    "G",
    "ICN",
    "INT",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TC",
    "TD",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
python-downloads = "manual"
required-version = ">=0.13.10"

[tool.uv.build-backend]
module-root = ""
namespace = true
source-exclude = [
    ".dockerignore",
    ".env.local",
    ".pre-commit-config.yaml",
    ".python-version",
    ".venv/**/*",
    "*.sh",
    "coverage/*",
    "db/*",
    "Dockerfile",
    "features/**/*",
    "README.md",
    "uv.lock",
]
