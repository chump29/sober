fail_fast: true
repos:
  - repo: local
    hooks:
      - id: audit
        name: audit
        entry: uv audit
        language: unsupported
        pass_filenames: false
        args:
          - --directory
          - backend
          - --preview-features
          - audit-command
          - --locked
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: unsupported
        types:
          - python
        require_serial: true
        args:
          - --rcfile=backend/pyproject.toml
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty
        language: unsupported
        types:
          - python
        args:
          - check
          - --error-on-warning
        require_serial: true
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
  - repo: https://github.com/pyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args:
          - --recursive
          - --configfile
          - backend/pyproject.toml
          - --quiet
          - .
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
  - repo: https://github.com/dotenv-linter/dotenv-linter
    rev: v4.0.0
    hooks:
      - id: dotenv-linter
        args:
          - check
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.2.0
    hooks:
      - id: cspell
        args:
          - --no-must-find-files
          - --no-config-search
          - --config
          - .vscode/cspell.json
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
