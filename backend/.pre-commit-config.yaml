fail_fast: true
repos:
  - repo: local
    hooks:
      - id: audit
        name: audit
        entry: uv audit
        language: unsupported
        pass_filenames: false
        args:
          - --directory
          - backend
          - --locked
          - --preview-features
          - audit-command
      - id: ty
        name: ty
        entry: uv run ty
        language: unsupported
        types:
          - python
        args:
          - check
          - --error-on-warning
        require_serial: true
  - repo: https://github.com/pyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args:
          - --configfile
          - backend/pyproject.toml
          - --quiet
          - --recursive
          - .
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format
