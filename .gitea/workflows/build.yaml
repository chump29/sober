name: Build Sᴏʙᴇᴙ Tᴙᴀᴄᴋᴇᴙ

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  check-frontend:
    runs-on: amd64

    env:
      BUN_INSTALL_CACHE_DIR: /tmp/.bun-cache

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Get Bun cache
        uses: actions/cache@v6
        with:
          key: bun-${{ github.event.repository.name }}-${{ hashFiles('frontend/bun.lock') }}
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}

      - name: Install dependencies
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: bun ci

      - name: CSpell
        uses: streetsidesoftware/cspell-action@v9
        with:
          check_dot_files: true
          config: frontend/node_modules/@postfmly/config/.vscode/cspell.json
          incremental_files_only: false
          root: frontend
          verbose: true

      - name: Scanning
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: bun run scan

      - name: Linting
        run: bun run lint:ci

      - name: Testing
        run: bun run test:coverage

  check-backend:
    runs-on: amd64

    env:
      PRE_COMMIT_HOME: /tmp/.pre-commit-cache
      RUFF_CACHE_DIR: /tmp/.ruff-cache
      UV_CACHE_DIR: /tmp/.uv-cache
      VSCODE_DIR: ${{ github.workspace }}/.vscode_tmp

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out cSpell config
        uses: actions/checkout@v7
        with:
          clean: false
          path: ${{ env.VSCODE_DIR }}
          repository: admin/config
          sparse-checkout: |
            .vscode/cspell.json
          sparse-checkout-code-mode: false

      - name: Move .vscode
        run: |
          mv ${{ env.VSCODE_DIR }}/.vscode ${{ github.workspace }}/
          rm -rf ${{ env.VSCODE_DIR }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Get uv cache
        uses: actions/cache@v6
        with:
          key: uv-${{ github.event.repository.name }}-${{ hashFiles('backend/uv.lock') }}
          path: |
            ${{ env.UV_CACHE_DIR }}
            backend/.venv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Get pre-commit cache
        uses: actions/cache@v6
        with:
          key: pre-commit-${{ github.event.repository.name }}-${{ hashFiles('backend/.pre-commit-config.yaml')}}
          path: |
            ${{ env.PRE_COMMIT_HOME }}
            ${{ env.RUFF_CACHE_DIR }}

      - name: Linting
        run: ./lint.sh

      - name: Testing
        run: ./test.sh

  amd64:
    if: github.event_name != 'pull_request'
    needs: [check-frontend, check-backend]
    runs-on: amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log into repository
        uses: docker/login-action@v4
        with:
          registry: git.postfmly.com
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and push frontend
        working-directory: frontend
        run: docker buildx build --platform linux/amd64 --tag git.postfmly.com/admin/sober-frontend:amd64 --push .

      - name: Build and push backend
        working-directory: backend
        run: docker buildx build --platform linux/amd64 --tag git.postfmly.com/admin/sober-backend:amd64 --push .

  arm64:
    if: github.event_name != 'pull_request'
    needs: [check-frontend, check-backend]
    runs-on: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log into repository
        uses: docker/login-action@v4
        with:
          registry: git.postfmly.com
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and push frontend
        working-directory: frontend
        run: docker buildx build --platform linux/arm64 --tag git.postfmly.com/admin/sober-frontend:arm64 --push .

      - name: Build and push backend
        working-directory: backend
        run: docker buildx build --platform linux/arm64 --tag git.postfmly.com/admin/sober-backend:arm64 --push .

  manifest:
    if: github.event_name != 'pull_request'
    needs: [amd64, arm64]
    runs-on: amd64

    steps:
      - name: Log into repository
        uses: docker/login-action@v4
        with:
          registry: git.postfmly.com
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Create and push frontend manifest
        run: |
          docker buildx imagetools create \
            --tag git.postfmly.com/admin/sober-frontend:latest \
            git.postfmly.com/admin/sober-frontend:amd64 \
            git.postfmly.com/admin/sober-frontend:arm64

      - name: Create and push backend manifest
        run: |
          docker buildx imagetools create \
            --tag git.postfmly.com/admin/sober-backend:latest \
            git.postfmly.com/admin/sober-backend:amd64 \
            git.postfmly.com/admin/sober-backend:arm64
